[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlora-serving-lab"
version = "0.1.0"
description = "Fine-tuning and serving a small model for Portuguese claim extraction on one 6 GiB consumer GPU"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Fillipe Loose" }]
keywords = ["qlora", "peft", "quantisation", "inference", "nlp", "portuguese"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Nothing. The corpus, the rule baseline, the metrics and the statistics all run on the standard
# library alone, which is what keeps the offline half of this repository testable in CI without
# a GPU, a model hub or four gigabytes of wheels.
dependencies = []

[project.optional-dependencies]
# The GPU half. Separate because CI has no GPU and installing torch there would add ten minutes
# to every run to exercise code that cannot execute.
gpu = [
  "torch>=2.6",
  "transformers>=4.57",
  "peft>=0.17",
  "bitsandbytes>=0.48",
  "accelerate>=1.0",
]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
qlora-lab = "qlora_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qlora_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
