version: 2
updates:
  # pip, not uv: the package has no lockfile, and the bounds in pyproject.toml are what
  # resolution actually uses.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
