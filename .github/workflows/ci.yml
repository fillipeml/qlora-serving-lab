name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test, no GPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # `[dev]` and deliberately not `[gpu]`. A hosted runner has no CUDA device, so installing
      # four gigabytes of wheels here would buy the right to import modules that cannot execute.
      # What CI can check is everything that does not need a card, which is the corpus, the
      # schema, the metrics, the statistics and the rule baseline.
      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: ruff format --check .

      - run: pytest -q

  offline:
    name: the offline half needs no GPU stack at all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pip install -e .

      # The README says the corpus, the baseline and the metrics run on the standard library
      # alone. A `torch` that crept into a module-level import would make that false without
      # breaking anything, because the GPU extra is installed everywhere the code is developed.
      # This is the only place the claim is actually tested.
      - name: No module-level import of the GPU stack
        run: |
          python - <<'EOF'
          import importlib, sys
          for name in ("schema", "generate", "rules", "metrics", "stats", "prompts",
                       "evaluate", "cli"):
              importlib.import_module(f"qlora_lab.{name}")
          leaked = sorted({"torch", "transformers", "peft", "bitsandbytes", "accelerate"}
                          & set(sys.modules))
          if leaked:
              raise SystemExit(f"these were imported at module scope: {leaked}")
          print("clean")
          EOF

      - name: The rule baseline reproduces without a card
        run: |
          python -m qlora_lab data
          python -m qlora_lab baseline --split validation | tee baseline.txt
          grep -q "JSON validity        100.0%" baseline.txt

  corpus:
    name: the corpus is invented, and the splits have not moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The suite pins a digest of the test split, which is the real guard. These greps are the
      # blunter version that catches a file arriving from somewhere other than the generator:
      # the corpus carries no document identifier belonging to any real Brazilian scheme,
      # because it carries no identifiers at all.
      - name: No identifier that belongs to a real scheme
        run: |
          set -e
          if grep -rEn '[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}' data/ src/; then
            echo "a CPF-shaped string is in the corpus"; exit 1
          fi
          if grep -rEn '[0-9]{2}\.[0-9]{3}\.[0-9]{3}/[0-9]{4}-[0-9]{2}' data/ src/; then
            echo "a CNPJ-shaped string is in the corpus"; exit 1
          fi
          if grep -rEn '[A-Z]{3}-?[0-9][A-Z0-9][0-9]{2}\b' data/; then
            echo "a vehicle plate is in the corpus"; exit 1
          fi
          echo "ok"

      - name: No adapter weights are committed
        run: |
          if git ls-files --error-unmatch 'adapters/*/adapter_model.safetensors' 2>/dev/null; then
            echo "adapter weights are committed; they are a function of the seed and the data"
            exit 1
          fi
          echo "ok"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
